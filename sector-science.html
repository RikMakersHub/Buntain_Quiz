<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Quiz Console</title>
    <script src="https://tailwindcss.com"></script>
    <style>body { font-family: 'JetBrains Mono', monospace; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">
    <header class="border-b border-slate-800 bg-slate-900/50 p-4 flex justify-between items-center">
        <a href="index.html" class="text-xs text-yellow-500 hover:underline">&larr; Return to Dashboard</a>
        <span class="text-xs tracking-widest text-slate-500 uppercase font-bold">Buntain Core Simulator</span>
    </header>

    <main class="max-w-3xl w-full mx-auto p-4 flex-grow flex flex-col justify-center">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 md:p-8 relative overflow-hidden shadow-xl">
            <!-- Precise Countdown Bar -->
            <div class="absolute top-0 left-0 w-full h-1 bg-slate-800">
                <div id="timer_bar" class="h-full bg-yellow-400 w-full transition-all duration-100 ease-linear"></div>
            </div>

            <div class="flex justify-between items-center mb-6 text-xs text-slate-500">
                <span id="card_index" class="tracking-widest uppercase">Question Loading...</span>
                <span id="timer_text" class="font-bold text-yellow-500">10.0s REMAINING</span>
            </div>

            <div class="min-h-[140px] flex items-center mb-6">
                <p id="question_display" class="text-lg md:text-xl font-medium leading-relaxed text-slate-200">Synchronizing database data structures...</p>
            </div>

            <!-- Concealed Answer Box Container -->
            <div id="answer_box" class="hidden mb-6 p-4 bg-yellow-950/20 border border-yellow-500/20 rounded-lg">
                <span class="text-xs uppercase tracking-widest text-yellow-500 block mb-1 font-bold">System Target Answer:</span>
                <p id="answer_display" class="text-lg font-bold text-yellow-400"></p>
            </div>

            <div class="flex justify-between items-center pt-4 border-t border-slate-800/60">
                <button onclick="toggleAnswer()" class="bg-slate-800 border border-slate-700 px-4 py-2 rounded-lg font-bold text-xs hover:bg-slate-700 transition">👁️ Toggle Mask</button>
                <button onclick="nextQuestion()" class="bg-yellow-500 text-slate-950 px-5 py-2 rounded-lg font-bold text-xs hover:bg-yellow-400 transition">Next Question &rarr;</button>
            </div>
        </div>
    </main>

    <!-- Connect directly to your dynamic router logic -->
    <script src="app.js"></script>
</body>
</html>
