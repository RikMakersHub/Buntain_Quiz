<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Quiz Console</title>
    <style>
        /* Document Frame Initialization */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Configuration Ribbon Layout */
        header {
            border-bottom: 1px solid #1e293b;
            background-color: rgba(15, 23, 42, 0.5);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header a {
            font-size: 0.75rem;
            color: #eab308;
            text-decoration: none;
        }
        header a:hover {
            text-decoration: underline;
        }
        header .system-title {
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            color: #64748b;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* Core Card Board Setup */
        main {
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            padding: 1rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .quiz-card {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 0.75rem;
            padding: 2rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
        }

        /* High Precision Dynamic Timer Line Layout */
        .timer-track {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: #1e293b;
        }
        #timer_bar {
            height: 100%;
            width: 100%;
            background-color: #eab308;
            transition: all 0.1s linear;
        }
        /* Dynamic state swaps applied dynamically from engine thread */
        #timer_bar.warning { background-color: #ef4444; }
        #timer_bar.critical { background-color: #dc2626; }

        /* Meta State Typography Row */
        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.75rem;
            color: #64748b;
        }
        .meta-row uppercase {
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        #timer_text {
            font-weight: bold;
            color: #eab308;
        }
        #timer_text.critical-text {
            color: #ef4444;
        }

        /* Question Context Rendering Block */
        .question-box {
            min-height: 140px;
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        #question_display {
            font-size: 1.25rem;
            line-height: 1.6;
            color: #e2e8f0;
        }

        /* Secure Mask Hidden Data Block */
        #answer_box {
            margin-bottom: 1.5rem;
            padding: 1rem;
            background-color: rgba(66, 32, 6, 0.2);
            border: 1px solid rgba(234, 179, 8, 0.2);
            border-radius: 0.5rem;
        }
        #answer_box.hidden {
            display: none;
        }
        .answer-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #eab308;
            display: block;
            margin-bottom: 0.25rem;
            font-weight: bold;
        }
        #answer_display {
            font-size: 1.125rem;
            font-weight: bold;
            color: #facc15;
        }

        /* Navigation Execution Panel Layout */
        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid rgba(30, 41, 59, 0.6);
        }
        button {
            border-radius: 0.5rem;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background-color 0.15s, transform 0.1s;
            font-family: inherit;
        }
        button:active {
            transform: scale(0.95);
        }
        .btn-mask {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 0.5rem 1rem;
        }
        .btn-mask:hover {
            background-color: #334155;
        }
        .btn-next {
            background-color: #eab308;
            border: none;
            color: #020617;
            padding: 0.6rem 1.2rem;
        }
        .btn-next:hover {
            background-color: #facc15;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html">&larr; Return to Dashboard</a>
        <span class="system-title">Buntain Core Simulator</span>
    </header>

    <main>
        <div class="quiz-card">
            <!-- Precise Countdown Bar -->
            <div class="timer-track">
                <div id="timer_bar"></div>
            </div>

            <div class="meta-row">
                <span id="card_index">Question Loading...</span>
                <span id="timer_text">10.0s REMAINING</span>
            </div>

            <div class="question-box">
                <p id="question_display">Synchronizing database data structures...</p>
            </div>

            <!-- Concealed Answer Box Container -->
            <div id="answer_box" class="hidden">
                <span class="answer-label">System Target Answer:</span>
                <p id="answer_display"></p>
            </div>

            <div class="action-row">
                <button onclick="toggleAnswer()" class="btn-mask">👁️ Toggle Mask</button>
                <button onclick="nextQuestion()" class="btn-next">Next Question &rarr;</button>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
